name: iOS

# Always: build the app for iOS without signing, to prove it compiles.
# When the App Store Connect secrets exist and a tag vX.Y.Z is pushed (or you press "Run workflow"
# with upload = true): sign, build, and send the build to TestFlight.
on:
  push:
    branches: [ios, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight (needs the secrets)'
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HAS_KEYS: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPSTORE_PROFILE_B64 != '' && secrets.APPSTORE_P12_B64 != '' && secrets.APPSTORE_P12_PASSWORD != '' }}
      WANT_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.upload == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the web game
        run: |
          npm ci
          npx vite build

      - name: Sync Capacitor and install pods
        run: npx cap sync ios

      - name: Compile check (no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -n 25

      - name: Say what happens next
        run: |
          echo "HAS_KEYS=$HAS_KEYS  WANT_UPLOAD=$WANT_UPLOAD"
          if [ "$HAS_KEYS" != "true" ]; then echo "::notice::App Store Connect secrets are not set: compiled only, nothing uploaded."; fi

      - name: Sign, archive and upload to TestFlight
        if: env.HAS_KEYS == 'true' && env.WANT_UPLOAD == 'true'
        env:
          KEY_P8_B64: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_B64 }}
          P12_B64: ${{ secrets.APPSTORE_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          echo "$KEY_P8_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Import the distribution certificate (with its private key) into a throwaway
          # keychain for this run, so xcodebuild can find "Apple Distribution" to sign with.
          P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$P12_B64" | base64 --decode > "$P12_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # Install the manually-created App Store distribution profile so xcodebuild
          # does not try to auto-create (and fails on) an unrelated Development profile.
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_UUID=$(grep -a -A1 '<key>UUID</key>' "$PROFILE_PATH" | tail -n1 | sed -E 's/.*<string>(.*)<\/string>.*/\1/')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="1.0.0" ;; esac
          AUTH=(-authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # BK_* only override signing for the App target (see project.pbxproj); Pods targets
          # don't reference these variables, so they stay on Automatic signing untouched.
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BK_SIGN_STYLE=Manual BK_SIGN_IDENTITY="Apple Distribution" BK_PROFILE_UUID="$PROFILE_UUID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            "<key>teamID</key><string>$TEAM_ID</string>" \
            '<key>signingStyle</key><string>manual</string>' \
            '<key>uploadSymbols</key><true/>' \
            '</dict></plist>' > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 25
          rm -f "$KEY_PATH" "$PROFILE_PATH" "$P12_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true
