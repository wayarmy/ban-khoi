name: iOS

# Always: build the app for iOS without signing, to prove it compiles.
# When the App Store Connect secrets exist and a tag vX.Y.Z is pushed (or you press "Run workflow"
# with upload = true): sign, build, and send the build to TestFlight.
on:
  push:
    branches: [ios, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight (needs the secrets)'
        type: boolean
        default: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HAS_KEYS: ${{ secrets.APPSTORE_KEY_P8 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      WANT_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.upload == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the web game
        run: |
          npm ci
          npx vite build

      - name: Sync Capacitor and install pods
        run: npx cap sync ios

      - name: Compile check (no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -n 25

      - name: Say what happens next
        run: |
          echo "HAS_KEYS=$HAS_KEYS  WANT_UPLOAD=$WANT_UPLOAD"
          if [ "$HAS_KEYS" != "true" ]; then echo "::notice::App Store Connect secrets are not set: compiled only, nothing uploaded."; fi

      - name: Sign, archive and upload to TestFlight
        if: env.HAS_KEYS == 'true' && env.WANT_UPLOAD == 'true'
        env:
          KEY_P8_B64: ${{ secrets.APPSTORE_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          echo "$KEY_P8_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="1.0.0" ;; esac
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 25
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>destination</key><string>upload</string>' \
            "<key>teamID</key><string>$TEAM_ID</string>" \
            '<key>signingStyle</key><string>automatic</string>' \
            '<key>uploadSymbols</key><true/>' \
            '</dict></plist>' > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 25
          rm -f "$KEY_PATH"
